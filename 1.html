<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Authentication Required</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <!-- Fonts (external request to Google). Remove these two links for a fully self-contained, offline page. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --bg: #06080b;
                --panel: #0c1117;
                --panel2: #0f161e;
                --line: rgba(95, 200, 216, 0.13);
                --line2: rgba(95, 200, 216, 0.06);
                --ink: #cdd6dc;
                --dim: #6b7782;
                --faint: #465058;
                --cyan: #5bc8d8;
                --green: #5fd08a;
                /* the button accent is driven by the tool's "primary color" field */
                --accent: #4CAF50;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            .grid-bg {
                position: fixed;
                inset: 0;
                background-image: linear-gradient(var(--line2) 1px, transparent 1px),
                    linear-gradient(90deg, var(--line2) 1px, transparent 1px);
                background-size: 42px 42px;
                opacity: 0.5;
                pointer-events: none;
                z-index: 0;
            }

            .staticrypt-content {
                position: relative;
                z-index: 1;
                height: 100%;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-page {
                width: 380px;
                max-width: 92vw;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: linear-gradient(160deg, var(--panel), var(--panel2));
                border: 1px solid var(--line);
                border-top: 2px solid var(--accent);
                border-radius: 10px;
                max-width: 380px;
                margin: 0 auto 100px;
                padding: 30px 30px 32px;
                text-align: left;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            }

            .staticrypt-meta {
                font-family: "JetBrains Mono", monospace;
                font-size: 0.6rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--dim);
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 12px;
            }

            .staticrypt-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--green);
                box-shadow: 0 0 8px var(--green);
                animation: staticrypt-pulse 1.6s infinite;
            }

            @keyframes staticrypt-pulse {
                50% {
                    opacity: 0.3;
                }
            }

            .staticrypt-instructions {
                margin-bottom: 4px;
            }

            .staticrypt-title {
                font-family: "Newsreader", Georgia, serif;
                font-size: 1.5rem;
                line-height: 1.18;
                color: #e7eef2;
                margin: 0 0 6px;
            }

            .staticrypt-sub {
                font-size: 0.85rem;
                color: var(--dim);
                margin: 0;
                line-height: 1.5;
            }

            .staticrypt-hr {
                margin: 18px 0;
                border: 0;
                border-top: 1px solid var(--line);
            }

            .staticrypt-password-container {
                position: relative;
                background: var(--panel2);
                border: 1px solid var(--line);
                border-radius: 6px;
                margin: 0 0 14px;
                box-sizing: border-box;
                transition: border-color 0.15s ease;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--accent);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-family: "JetBrains Mono", monospace;
                font-size: 14px;
                color: var(--ink);
                outline: 0;
                padding: 14px 42px 14px 14px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: var(--faint);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                opacity: 0.5;
                filter: invert(1);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 16px;
                font-family: "JetBrains Mono", monospace;
                font-size: 0.66rem;
                letter-spacing: 0.08em;
                color: var(--dim);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.4);
                margin-right: 14px;
                accent-color: var(--accent);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "JetBrains Mono", monospace;
                text-transform: uppercase;
                letter-spacing: 0.18em;
                font-size: 0.72rem;
                font-weight: 700;
                outline: 0;
                background: var(--accent);
                color: #06080b;
                width: 100%;
                border: 0;
                border-radius: 6px;
                padding: 15px;
                cursor: pointer;
                transition: filter 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(1.12);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                position: relative;
                z-index: 1;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--line);
                border-right-color: var(--cyan);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
